name: Deploy Documentation to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'software/**'
      - 'hardware/**'
      - 'README.md'
      - 'LICENSE'
      - '.github/workflows/deploy-mdbook.yml'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force complete rebuild'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Setup mdBook
      uses: peaceiris/actions-mdbook@v2
      with:
        mdbook-version: '0.4.52'

    - name: Build documentation with configurable navbar
      env:
        GITHUB_SERVER_URL: ${{ github.server_url }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        echo "Building documentation using modular scripts..."
        echo "Repository URL will be: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
        
        # Load configuration and build with navbar injection
        source .github/scripts/config.sh
        python3 .github/scripts/build_docs.py
        
        # Build navbar using modular function
        source .github/scripts/navbar-builder.sh
        build_navbar_into_files "${BUILD_DIR}"
        
        echo "Documentation build with navbar completed!"

    - name: Verify build output
      run: |
        echo "Verifying documentation build..."
        ls -la software/book/book/
        if [ ! -f "software/book/book/index.html" ]; then
          echo "ERROR: index.html not found!"
          exit 1
        fi
        echo "Build verification passed!"

    - name: Deploy to GitHub Pages (gh-pages branch)
      if: github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./software/book/book
        publish_branch: gh-pages
        force_orphan: true
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
        commit_message: 'Deploy documentation - ${{ github.sha }}'
